
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>开饭记录 yummy</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #fffaf8;
    color: #514946;
}


/* =========================================================
   APP
========================================================= */

.app {
    min-height: 100vh;
    display: flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 230px;
    height: 100vh;

    position: sticky;
    top: 0;

    flex-shrink: 0;

    background: rgba(255,255,255,.94);

    border-right: 1px solid #f1e4e0;

    padding: 34px 18px;

    display: flex;
    flex-direction: column;

    z-index: 1000;

    backdrop-filter: blur(20px);
}

.logo {
    padding: 0 14px 28px;
}

.logo-main {
    font-size: 22px;
    font-weight: 800;
}

.logo-sub {
    margin-top: 6px;

    font-size: 10px;

    letter-spacing: 1.2px;

    color: #b6a8a3;
}


/* =========================================================
   NAV
========================================================= */

.nav {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.nav-item {
    width: 100%;

    border: 0;
    background: transparent;

    padding: 13px 15px;

    border-radius: 15px;

    text-align: left;

    color: #8b7e79;

    font-size: 14px;

    cursor: pointer;

    transition: .25s ease;
}

.nav-item:hover {
    background: #fff3f0;
    color: #d77f83;
    transform: translateX(3px);
}

.nav-item.active {
    background: #ffe9e6;
    color: #d6757b;
    font-weight: 700;
}


/* =========================================================
   MOBILE
========================================================= */

.mobile-menu {
    display: none;

    position: fixed;

    left: 16px;
    top: 16px;

    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 13px;

    background: white;

    box-shadow:
        0 8px 25px rgba(80,55,45,.12);

    font-size: 19px;

    cursor: pointer;

    z-index: 2000;
}

.sidebar-overlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(45,35,32,.22);

    z-index: 900;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;

    min-width: 0;

    padding:
        40px
        48px
        80px;
}

.content {
    max-width: 1280px;
    margin: auto;
}


/* =========================================================
   CALENDAR
========================================================= */

.calendar-section {
    background: white;

    border: 1px solid #f2e5e1;

    border-radius: 26px;

    padding: 30px;

    margin-bottom: 55px;

    box-shadow:
        0 15px 45px rgba(93,64,54,.055);
}

.calendar-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.calendar-title {
    font-size: 26px;
    font-weight: 800;
}

.calendar-title span {
    color: #d9868a;
}

.calendar-control {
    display: flex;

    align-items: center;

    gap: 8px;
}

.calendar-control button {
    width: 34px;
    height: 34px;

    border: 0;

    border-radius: 10px;

    background: #fff3f0;

    color: #cf8589;

    cursor: pointer;
}

.month-title {
    min-width: 100px;

    text-align: center;

    font-size: 14px;

    font-weight: 700;
}

.calendar-note {
    font-size: 12px;

    color: #a99a95;

    margin-bottom: 20px;
}

.calendar-note span {
    display: inline-block;
    margin-right: 18px;
}

.note-pink::before,
.note-green::before {
    content: "";

    display: inline-block;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    margin-right: 6px;
}

.note-pink::before {
    background: #f6c5c8;
}

.note-green::before {
    background: #bfe3cf;
}


/* =========================================================
   CALENDAR GRID
========================================================= */

.weekdays,
.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 8px;
}

.weekdays {
    margin-bottom: 8px;
}

.weekdays div {
    text-align: center;

    font-size: 11px;

    color: #b5a8a3;
}

.calendar-day {
    min-height: 66px;

    position: relative;

    border: 1px solid transparent;

    border-radius: 14px;

    padding: 9px;

    background: #fffaf9;

    cursor: pointer;

    transition: .2s ease;
}

.calendar-day:hover {
    border-color: #f1d9d5;

    transform: translateY(-2px);
}

.calendar-day.empty {
    background: transparent;
    cursor: default;
}

.day-number {
    font-size: 12px;
    color: #8e817d;
}

.calendar-day.today .day-number {
    color: #d8757a;
    font-weight: 800;
}

.calendar-day.selected {
    border-color: #df999c;

    box-shadow:
        0 0 0 2px rgba(223,153,156,.12);
}

.calendar-day.pink {
    background: #fff0f1;
}

.calendar-day.green {
    background: #eff9f3;
}

.day-marker {
    position: absolute;

    bottom: 7px;

    left: 8px;
    right: 8px;

    height: 4px;

    border-radius: 10px;
}

.pink .day-marker {
    background: #f1aeb4;
}

.green .day-marker {
    background: #9ed4b6;
}


/* =========================================================
   MARK BUTTONS
========================================================= */

.mark-tools {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.mark-btn {
    border: 0;

    padding: 8px 13px;

    border-radius: 10px;

    font-size: 12px;

    cursor: pointer;
}

.mark-pink {
    background: #fff0f1;
    color: #d88389;
}

.mark-green {
    background: #edf8f1;
    color: #73ad8d;
}

.mark-clear {
    background: #f7f5f4;
    color: #9d928d;
}


/* =========================================================
   SECTION
========================================================= */

.category-section {
    margin-bottom: 65px;

    scroll-margin-top: 35px;

    border-radius: 22px;
}

.section-head {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 20px;
}

.section-title-wrap h2 {
    margin: 0;

    font-size: 25px;

    color: #4d4542;
}

.section-title-wrap p {
    margin: 7px 0 0;

    font-size: 12px;

    color: #b1a29d;
}


/* =========================================================
   COLLAPSE
========================================================= */

.section-collapse {
    border: 0;

    background: #fff3f0;

    color: #c97e82;

    width: 32px;
    height: 32px;

    border-radius: 10px;

    cursor: pointer;

    flex-shrink: 0;

    transition: .25s ease;
}

.section-collapse:hover {
    background: #ffe8e5;
}

.section-collapse .arrow {
    display: inline-block;

    transition: transform .25s ease;
}

.category-section.collapsed
.section-collapse .arrow {
    transform: rotate(-90deg);
}

.category-section.collapsed
.section-body {
    display: none;
}


/* =========================================================
   UPLOAD
========================================================= */

.upload-box {
    display: flex;

    align-items: center;

    gap: 8px;
}

.upload-btn {
    border: 1px solid #f1ddd8;

    background: white;

    color: #c67d81;

    padding: 9px 13px;

    border-radius: 12px;

    font-size: 12px;

    cursor: pointer;

    transition: .2s ease;

    white-space: nowrap;
}

.upload-btn:hover {
    background: #fff4f2;

    transform: translateY(-1px);
}


/*
    真正的 file input 隐藏
*/

.hidden-file-input {
    display: none;
}


/* =========================================================
   MEDIA GRID
========================================================= */

.media-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px,1fr));

    gap: 15px;
}


/* =========================================================
   MEDIA CARD
========================================================= */

.media-card {
    position: relative;

    overflow: hidden;

    border-radius: 17px;

    background: white;

    border: 1px solid #f1e6e2;

    box-shadow:
        0 8px 25px rgba(90,60,50,.045);

    transition: .25s ease;
}

.media-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 15px 35px rgba(90,60,50,.1);
}

.media-card img,
.media-card video {
    width: 100%;

    height: auto;

    display: block;

    background: #f5f1ef;

    transition:
        filter .35s ease,
        opacity .35s ease;
}


/* =========================================================
   已回家
========================================================= */

.media-card.home-state img,
.media-card.home-state video {
    filter:
        grayscale(.65)
        brightness(1.12)
        opacity(.38);
}

.home-overlay {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 78%;

    padding: 15px 12px;

    border: 1px solid rgba(255,255,255,.68);

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(2px);

    color: white;

    font-size: 20px;

    font-weight: 800;

    letter-spacing: 5px;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;
}

.media-card.home-state
.home-overlay {
    opacity: 1;
}


/* =========================================================
   FLOWER BUTTON
========================================================= */

.home-toggle {
    position: absolute;

    right: 8px;
    bottom: 43px;

    width: 32px;
    height: 32px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.92);

    color: #d98287;

    box-shadow:
        0 4px 12px rgba(70,45,40,.15);

    cursor: pointer;

    z-index: 5;

    font-size: 15px;

    transition: .2s ease;
}

.home-toggle:hover {
    transform: scale(1.08);

    background: white;
}

.media-card.home-state
.home-toggle {
    background: #f2aeb3;
    color: white;
}


/* =========================================================
   MEDIA INFO
========================================================= */

.media-info {
    min-height: 38px;

    padding: 10px 12px;

    font-size: 11px;

    color: #a1948f;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 5px;
}

.media-name {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.media-delete {
    flex-shrink: 0;

    border: 0;

    background: transparent;

    color: #c4b5b0;

    cursor: pointer;

    font-size: 11px;
}

.media-delete:hover {
    color: #d67c81;
}


/* =========================================================
   DAILY EMPTY
========================================================= */

.daily-empty {
    border: 1px dashed #eadbd7;

    background: #fffdfc;

    border-radius: 18px;

    min-height: 180px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #b5a7a2;

    font-size: 13px;
}


/* =========================================================
   CHEF ARCHIVE
========================================================= */

.chef-date-group {
    margin-bottom: 17px;

    border: 1px solid #f0e3df;

    background: white;

    border-radius: 18px;

    overflow: hidden;
}

.chef-date-header {
    width: 100%;

    border: 0;

    background: white;

    padding: 15px 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    cursor: pointer;

    color: #665b57;

    font-size: 14px;

    font-weight: 700;

    text-align: left;
}

.chef-date-header:hover {
    background: #fffaf8;
}

.date-header-left {
    display: flex;

    align-items: center;

    gap: 10px;
}

.date-icon {
    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 9px;

    background: #fff0ed;
}

.date-count {
    color: #b4a6a1;

    font-size: 11px;

    font-weight: 400;
}

.expand-icon {
    color: #c4b4af;

    transition: transform .25s ease;
}

.chef-date-group.collapsed
.expand-icon {
    transform: rotate(-90deg);
}

.chef-date-content {
    padding:
        0
        17px
        17px;
}

.chef-date-group.collapsed
.chef-date-content {
    display: none;
}

.chef-empty {
    border: 1px dashed #eadbd7;

    background: #fffdfc;

    border-radius: 18px;

    padding: 55px 20px;

    text-align: center;

    color: #b4a6a1;

    font-size: 13px;
}


/* =========================================================
   PASSWORD MODAL
========================================================= */

.password-modal {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(55,42,38,.32);

    backdrop-filter:
        blur(7px);

    z-index: 5000;

    opacity: 0;

    pointer-events: none;

    transition: .25s ease;
}

.password-modal.show {
    opacity: 1;

    pointer-events: auto;
}

.password-box {
    width: 100%;

    max-width: 340px;

    background: white;

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 25px 80px rgba(60,40,35,.2);

    text-align: center;
}

.password-flower {
    font-size: 27px;

    margin-bottom: 10px;
}

.password-box h3 {
    margin: 0;

    font-size: 18px;
}

.password-box p {
    margin: 8px 0 20px;

    font-size: 12px;

    color: #aa9b96;
}

.password-input {
    width: 100%;

    height: 46px;

    border: 1px solid #eadbd7;

    border-radius: 12px;

    outline: none;

    text-align: center;

    font-size: 20px;

    letter-spacing: 7px;

    color: #665b57;
}

.password-input:focus {
    border-color: #dfa0a4;

    box-shadow:
        0 0 0 3px rgba(223,160,164,.12);
}

.password-error {
    min-height: 18px;

    margin-top: 8px;

    font-size: 11px;

    color: #d9787e;
}

.password-actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.password-actions button {
    flex: 1;

    height: 40px;

    border: 0;

    border-radius: 11px;

    cursor: pointer;

    font-size: 12px;
}

.password-cancel {
    background: #f7f3f1;
    color: #9b8d88;
}

.password-confirm {
    background: #ffe8e5;
    color: #d5787d;
    font-weight: 700;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 28px;

    transform:
        translate(-50%,20px);

    opacity: 0;

    pointer-events: none;

    background: #514946;

    color: white;

    padding: 11px 17px;

    border-radius: 12px;

    font-size: 12px;

    transition: .3s ease;

    z-index: 6000;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .sidebar {
        position: fixed;

        left: -250px;

        top: 0;

        transition: left .3s ease;

        box-shadow:
            10px 0 35px rgba(50,35,30,.12);
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .sidebar-overlay.show {
        display: block;
    }

    .main {
        padding:
            75px
            20px
            60px;
    }

    .calendar-section {
        padding: 22px 16px;
    }

    .calendar-title {
        font-size: 21px;
    }

    .calendar-day {
        min-height: 55px;
    }

    .section-head {
        align-items: flex-start;

        flex-direction: column;
    }

    .upload-box {
        width: 100%;
    }

    .upload-btn {
        flex: 1;
        text-align: center;
    }

    .media-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }
}

@media (max-width: 480px) {

    .weekdays,
    .calendar-grid {
        gap: 4px;
    }

    .calendar-day {
        min-height: 48px;

        border-radius: 10px;
    }

    .day-number {
        font-size: 11px;
    }

    .media-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 9px;
    }

    .category-section {
        margin-bottom: 55px;
    }

    .home-overlay {
        font-size: 15px;
        letter-spacing: 3px;
    }

    .home-toggle {
        width: 28px;
        height: 28px;

        bottom: 41px;
    }

    .upload-box {
        flex-wrap: wrap;
    }

    .upload-btn {
        min-width: calc(50% - 4px);
    }
}

</style>
</head>


<body>


<!-- =========================================================
     MOBILE MENU
========================================================= -->

<button
    class="mobile-menu"
    id="mobileMenu">
    ☰
</button>

<div
    class="sidebar-overlay"
    id="sidebarOverlay">
</div>


<div class="app">


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
    class="sidebar"
    id="sidebar">

    <div class="logo">

        <div class="logo-main">
            🍚 yummy
        </div>

        <div class="logo-sub">
            MY LITTLE FOOD ARCHIVE
        </div>

    </div>


    <nav class="nav">

        <button
            class="nav-item active"
            data-target="daily">

            当日美食

        </button>


        <button
            class="nav-item"
            data-target="bai">

            白咪饭大厨

        </button>


        <button
            class="nav-item"
            data-target="lei">

            泪懵懵大厨

        </button>

    </nav>

</aside>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

<div class="content">


<!-- =========================================================
     CALENDAR
========================================================= -->

<section class="calendar-section">

    <div class="calendar-header">

        <div class="calendar-title">

            开饭记录
            <span>yummy</span>

        </div>


        <div class="calendar-control">

            <button id="prevMonth">
                ‹
            </button>

            <div
                class="month-title"
                id="monthTitle">
            </div>

            <button id="nextMonth">
                ›
            </button>

        </div>

    </div>


    <div class="calendar-note">

        <span class="note-pink">
            粉色日期为〈你怎么泪懵懵〉老师放饭
        </span>

        <span class="note-green">
            绿色日期为〈白咪饭-〉老师放饭
        </span>

    </div>


    <div class="weekdays">

        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>

    </div>


    <div
        class="calendar-grid"
        id="calendarGrid">
    </div>


    <div class="mark-tools">

        <button
            class="mark-btn mark-pink"
            id="markPink">
            标记粉色
        </button>

        <button
            class="mark-btn mark-green"
            id="markGreen">
            标记绿色
        </button>

        <button
            class="mark-btn mark-clear"
            id="markClear">
            清除标记
        </button>

    </div>

</section>


<!-- =========================================================
     当日美食
========================================================= -->

<section
    class="category-section"
    id="daily">

    <div class="section-head">

        <div class="section-title-wrap">

            <h2>
                当日美食
            </h2>

            <p>
                请在上方日历选择日期 展示为该日预览
            </p>

        </div>


        <button
            class="section-collapse"
            data-section="daily"
            title="展开 / 收缩">

            <span class="arrow">
                ▼
            </span>

        </button>

    </div>


    <div class="section-body">

        <div
            class="media-grid"
            id="dailyMediaGrid">
        </div>

    </div>

</section>


<!-- =========================================================
     白咪饭大厨
========================================================= -->

<section
    class="category-section"
    id="bai">

    <div class="section-head">

        <div class="section-title-wrap">

            <h2>
                白咪饭大厨
            </h2>

            <p>
                白咪饭大厨的单人盛宴
            </p>

        </div>


        <div class="upload-box">

            <!--
                注意：

                这里不再直接使用 label + file input。

                点击上传按钮以后，
                先经过上传密码验证，
                再打开系统文件选择器。
            -->

            <button
                class="upload-btn"
                id="baiImageButton">

                ＋ 上传图片

            </button>


            <button
                class="upload-btn"
                id="baiVideoButton">

                ＋ 上传视频

            </button>


            <input
                type="file"
                accept="image/*"
                multiple
                class="hidden-file-input"
                id="baiImageUpload">


            <input
                type="file"
                accept="video/*"
                multiple
                class="hidden-file-input"
                id="baiVideoUpload">


            <button
                class="section-collapse"
                data-section="bai"
                title="展开 / 收缩">

                <span class="arrow">
                    ▼
                </span>

            </button>

        </div>

    </div>


    <div class="section-body">

        <div id="baiArchive"></div>

    </div>

</section>


<!-- =========================================================
     泪懵懵大厨
========================================================= -->

<section
    class="category-section"
    id="lei">

    <div class="section-head">

        <div class="section-title-wrap">

            <h2>
                泪懵懵大厨
            </h2>

            <p>
                泪懵懵大厨的单人盛宴
            </p>

        </div>


        <div class="upload-box">

            <button
                class="upload-btn"
                id="leiImageButton">

                ＋ 上传图片

/* =========================================================

function formatDate(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const d =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function formatChineseDate(
    dateString
) {

    const parts =
        dateString.split("-");

    return `
        ${parts[0]}年
        ${Number(parts[1])}月
        ${Number(parts[2])}日
    `;
}

/* =========================================================

========================================================= */

function renderCalendar() {

    calendarGrid.innerHTML =
        "";

    const firstDay =
        new Date(
            calendarYear,
            calendarMonth,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            calendarYear,
            calendarMonth + 1,
            0
        ).getDate();


    monthTitle.textContent =
        `${calendarYear}年 ${calendarMonth + 1}月`;


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "calendar-day empty";

        calendarGrid.appendChild(
            empty
        );
    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                calendarYear,
                calendarMonth,
                day
            );

        const dateString =
            formatDate(date);


        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "calendar-day";


        if (
            dateString ===
            formatDate(new Date())
        ) {

            cell.classList.add(
                "today"

        if (
            dateString ===

                dateString

                marker
            );

        const number =
            document.createElement(
                "div"

        number.className =
            "day-number";

        number.textContent =

        cell.appendChild(
            number
        );

                renderCalendar();

                renderDaily();

                showToast(
                    `已选择 ${formatChineseDate(selectedDate)}`
                );

            }
        );


        calendarGrid.appendChild(
            cell
        );
    }
}

/* =========================================================
   FILE -> DATA URL
========================================================= */

function fileToDataURL(
    file
) {

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================

/* =========================================================
   HANDLE UPLOAD
========================================================= */

async function handleUpload(
    files,
    target
) {

    if (
        !files ||
        !files.length
    ) {

        return;
    }


    /*
        每次上传时，
        当前选中的日历日期
        就是归档日期
    */

    if (
        !target[selectedDate]
    ) {

        target[selectedDate] =
            [];
    }


    for (
        const file of files
    ) {

        const src =
            await fileToDataURL(
                file
            );


        target[selectedDate]
            .push({

                id:
                    Date.now() +
                    Math.random(),

                type:
                    file.type.startsWith(
                        "video"
                    )
                    ? "video"
                    : "image",

                name:
                    file.name,

                src:
                    src,

                home:
                    false

            });
    }


    saveData();


    renderChefArchives(
        baiRecords,
        baiArchive
    );

    renderChefArchives(
        leiRecords,
        leiArchive
    );

    renderDaily();


    showToast(
        `已归档到 ${formatChineseDate(selectedDate)}`
    );
}


/* =========================================================
   CALENDAR DAILY SYNC
========================================================= */

function getDailyRecords() {

    const bai =
        baiRecords[
            selectedDate
        ] || [];

    const lei =
        leiRecords[
            selectedDate
        ] || [];


    return [
        ...bai,
        ...lei
    ];
}


function renderDaily() {

    dailyMediaGrid.innerHTML =
        "";


    const records =
        getDailyRecords();


    if (
        !records.length
    ) {

        dailyMediaGrid.innerHTML = `

            <div
                class="daily-empty"
                style="grid-column:1/-1;">

                🍚

                <br>

                这一天还没有美食记录

            </div>

        `;

        return;
    }


    records.forEach(
        record => {

            dailyMediaGrid.appendChild(
                createMediaCard(
                    record,
                    "daily",
                    selectedDate
                )
            );

        }
    );
}


/* =========================================================
   CHEF ARCHIVE
========================================================= */

function renderChefArchives(
    records,
    container
) {

    container.innerHTML =
        "";


    const dates =
        Object.keys(records)
        .sort()
        .reverse();


    if (
        !dates.length
    ) {

        container.innerHTML = `

            <div class="chef-empty">

                🍳

                <br><br>

                还没有属于这位大厨的盛宴记录

            </div>

        `;

        return;
    }


    dates.forEach(
        date => {

            const group =
                document.createElement(
                    "div"
                );

            group.className =
                "chef-date-group";


            const header =
                document.createElement(
                    "button"
                );

            header.className =
                "chef-date-header";


            header.innerHTML = `

                <div class="date-header-left">

                    <div class="date-icon">
                        🍚
                    </div>

                    <div>

                        ${formatChineseDate(date)}

                        <span class="date-count">

                            ·
                            ${records[date].length}
                            条记录

                        </span>

                    </div>

                </div>


                <div class="expand-icon">
                    ▼
                </div>

            `;


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "chef-date-content";


            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "media-grid";


            records[date].forEach(
                record => {

                    grid.appendChild(
                        createMediaCard(
                            record,
                            "chef",
                            date,
                            records
                        )
                    );

                }
            );


            content.appendChild(
                grid
            );


            header.addEventListener(
                "click",
                () => {

                    group.classList.toggle(
                        "collapsed"
                    );

                }
            );


            group.appendChild(
                header
            );

            group.appendChild(
                content
            );

            container.appendChild(
                group
            );

        }
    );
}


/* =========================================================
   MEDIA CARD
========================================================= */

function createMediaCard(
    record,
    type,
    date,
    records
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "media-card";


    if (
        record.home
    ) {

        card.classList.add(
            "home-state"
        );
    }


    let media;


    if (
        record.type ===
        "video"
    ) {

        media =
            document.createElement(
                "video"
            );

        media.src =
            record.src;

        media.controls =
            true;

        media.preload =
            "metadata";

    }
    else {

        media =
            document.createElement(
                "img"
            );

        media.src =
            record.src;

        media.loading =
            "lazy";
    }


    card.appendChild(
        media
    );


    /*
        已回家文字
    */

    const homeOverlay =
        document.createElement(
            "div"
        );

    homeOverlay.className =
        "home-overlay";

    homeOverlay.textContent =
        "已回家";

    card.appendChild(
        homeOverlay
    );


    /*
        小花按钮
    */

    const homeButton =
        document.createElement(
            "button"
        );

    homeButton.className =
        "home-toggle";

    homeButton.title =
        record.home
        ? "取消已回家"
        : "标记已回家";

    homeButton.textContent =
        "✿";


    homeButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            handleHomeToggle(
                record
            );

        }
    );


    card.appendChild(
        homeButton
    );


    /*
        信息
    */

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "media-info";


    const name =
        document.createElement(
            "span"
        );

    name.className =
        "media-name";

    name.textContent =
        record.name ||
        "美食记录";


    info.appendChild(
        name
    );


    /*
        删除按钮
    */

    if (
        type === "chef"
    ) {

        const deleteBtn =
            document.createElement(
                "button"
            );

        deleteBtn.className =
            "media-delete";

        deleteBtn.textContent =
            "删除";


        deleteBtn.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                deleteMedia(
                    records,
                    date,
                    record
                );

            }
        );


        info.appendChild(
            deleteBtn
        );
    }


    card.appendChild(
        info
    );


    return card;
}


/* =========================================================
   DELETE
========================================================= */

function deleteMedia(
    records,
    date,
    record
) {

    const list =
        records[date];


    if (!list) {
        return;
    }


    const index =
        list.findIndex(
            item =>
                item.id ===
                record.id
        );


    if (
        index !== -1
    ) {

        list.splice(
            index,
            1
        );
    }


    if (
        !list.length
    ) {

        delete records[
            date
        ];
    }


    saveData();


    renderChefArchives(
        baiRecords,
        baiArchive
    );

    renderChefArchives(
        leiRecords,
        leiArchive
    );

    renderDaily();


    showToast(
        "记录已删除"
    );
}


/* =========================================================
   HOME STATE
========================================================= */

function handleHomeToggle(
    record
) {

    /*
        如果已经是“已回家”

        取消状态不需要密码。
    */

    if (
        record.home
    ) {

        record.home =
            false;

        saveData();

        renderAllMedia();

        showToast(
            "已取消「已回家」"
        );

        return;
    }


    /*
        检查的是：

        homePasswordVerifiedUntil

        而不是：

        uploadPasswordVerifiedUntil

        两者完全独立。
    */

    if (
        homePasswordIsValid()
    ) {

        record.home =
            true;

        saveData();

        renderAllMedia();

        showToast(
            "已标记为「已回家」"
        );

        return;
    }


    /*
        需要“已回家”密码
    */

    pendingHomeRecord =
        record;

    openPasswordModal(
        "home"
    );
}


/* =========================================================
   PASSWORD CONFIRM
========================================================= */

document
    .getElementById(
        "passwordConfirm"
    )
    .addEventListener(
        "click",
        verifyPassword
    );


passwordInput
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                verifyPassword();

            }

        }
    );


function verifyPassword() {

    const value =
        passwordInput.value;


    if (
        value !== PASSWORD
    ) {

        passwordError.textContent =
            "密码错误，请重新输入";

        passwordInput.value =
            "";

        passwordInput.focus();

        return;
    }


    /*
        ==========================================
        上传密码
        ==========================================
    */

    if (
        passwordMode ===
        "upload"
    ) {

        uploadPasswordVerifiedUntil =
            Date.now() +
            10 * 60 * 1000;


        localStorage.setItem(
            "uploadPasswordVerifiedUntil",
            uploadPasswordVerifiedUntil
        );


        const input =
            pendingFileInput;


        closePasswordModal();


        /*
            验证成功以后，
            才真正打开系统文件选择器。
        */

        if (
            input
        ) {

            input.click();

        }


        showToast(
            "上传权限已开启 · 10分钟内免验证"
        );

        return;
    }


    /*
        ==========================================
        已回家密码
        ==========================================
    */

    if (
        passwordMode ===
        "home"
    ) {

        homePasswordVerifiedUntil =
            Date.now() +
            10 * 60 * 1000;


        localStorage.setItem(
            "homePasswordVerifiedUntil",
            homePasswordVerifiedUntil
        );


        if (
            pendingHomeRecord
        ) {

            pendingHomeRecord.home =
                true;

            saveData();
        }


        closePasswordModal();


        renderAllMedia();


        showToast(
            "已回家权限已开启 · 10分钟内免验证"
        );

        return;
    }
}


/* =========================================================
   PASSWORD CANCEL
========================================================= */

document
    .getElementById(
        "passwordCancel"
    )
    .addEventListener(
        "click",
        closePasswordModal
    );


passwordModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            passwordModal
        ) {

            closePasswordModal();
        }

    }
);


/* =========================================================
   RENDER ALL
========================================================= */

function renderAllMedia() {

    renderDaily();

    renderChefArchives(
        baiRecords,
        baiArchive
    );

    renderChefArchives(
        leiRecords,
        leiArchive
    );
}


/* =========================================================
   SECTION COLLAPSE
========================================================= */

document
    .querySelectorAll(
        ".section-collapse"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const section =
                        document.getElementById(
                            button.dataset.section
                        );


                    section.classList.toggle(
                        "collapsed"
                    );

                }
            );

        }
    );


/* =========================================================
   SCROLL SPY
========================================================= */

const navItems =
    document.querySelectorAll(
        ".nav-item"
    );

const sections =
    document.querySelectorAll(
        ".category-section"
    );


const observer =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    if (
                        entry.isIntersecting
                    ) {

                        navItems.forEach(
                            item => {

                                item.classList.toggle(
                                    "active",

                                    item.dataset.target ===
                                    entry.target.id
                                );

                            }
                        );
                    }

                }
            );

        },
        {
            rootMargin:
                "-20% 0px -65% 0px"
        }
    );


sections.forEach(
    section =>
        observer.observe(
            section
        )
);


/* =========================================================
   NAV
========================================================= */

navItems.forEach(
    item => {

        item.addEventListener(
            "click",
            () => {

                const target =
                    document.getElementById(
                        item.dataset.target
                    );


                target.scrollIntoView({
                    behavior:
                        "smooth"
                });


                if (
                    window.innerWidth <=
                    900
                ) {

                    closeSidebar();

                }

            }
        );

    }
);


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const sidebarOverlay =
    document.getElementById(
        "sidebarOverlay"
    );

const mobileMenu =
    document.getElementById(
        "mobileMenu"
    );


function openSidebar() {

    sidebar.classList.add(
        "open"
    );

    sidebarOverlay.classList.add(
        "show"
    );
}


function closeSidebar() {

    sidebar.classList.remove(
        "open"
    );

    sidebarOverlay.classList.remove(
        "show"
    );
}


mobileMenu.addEventListener(
    "click",
    openSidebar
);


sidebarOverlay.addEventListener(
    "click",
    closeSidebar
);


/* =========================================================
   INITIALIZE
========================================================= */

renderCalendar();

renderDaily();

renderChefArchives(
    baiRecords,
    baiArchive
);

renderChefArchives(
    leiRecords,
    leiArchive
);

</script>

</body>
</html>
